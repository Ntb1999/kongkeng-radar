<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maris Advisor</title>
<meta name="description" content="Interactive prototype of Maris Advisor: Company 360, stock screener, comparison and research reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root, [data-theme="light"] {
  color-scheme: light;
  /* Maris design tokens (Figma variables) - Light Mode */
  --bg: #FFFFFF; --sub: #F6F6F6; --sub2: #E8E8E8; --hover: #F8F8F8;
  --line: #E8E8E8; --line2: #D0D0D0;
  --ink: #151515; --ink2: #5B5B5B; --ink3: #737373; --ink4: #A1A1A1;
  --brand: #E45F35; --brand-ink: #C94E27; --brand-soft: rgba(228,95,53,.1);
  --up: #009253; --up-soft: rgba(0,183,104,.1); --up-strong: #CCF1E1;
  --down: #CC3639; --down-soft: rgba(255,68,71,.1); --down-deep: #99292B;
  --warn: #B77202; --warn-soft: rgba(229,142,2,.1); --info: #14A6FA; --info-soft: rgba(20,166,250,.12);
  --s5: #009253; --s4: #00B768; --s3: #E58E02; --s2: #FF4447; --s1: #CC3639;
  --t5: #006E3E; --t3: #895501; --t1: #99292B;
  --dark: #151515;
  --sans: "Google Sans Flex","Google Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono: "IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r: 4px;

  /* Card and Component System Tokens */
  --card-bg: #FFFFFF;
  --card-sub: #F8FAFC;
  --card-border: #E2E8F0;
  --card-border-sub: #CBD5E1;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.05);

  /* MCP Suite Tokens */
  --mcp-banner-bg: linear-gradient(135deg, rgba(20,166,250,0.06) 0%, rgba(228,95,53,0.06) 100%);
  --mcp-banner-border: #CBD5E1;
  --mcp-box-bg: #FFFFFF;
  --mcp-box-border: #E2E8F0;
  --mcp-tile-bg: #F8FAFC;
  --mcp-tile-border: #E2E8F0;
}

[data-theme="dark"] {
  color-scheme: dark;
  /* Maris design tokens - Dark Mode */
  --bg: #0B0F19;
  --sub: #111827;
  --sub2: #1E2638;
  --hover: #192234;
  --line: #1F293D;
  --line2: #2E3C56;
  --ink: #F8FAFC;
  --ink2: #94A3B8;
  --ink3: #64748B;
  --ink4: #475569;
  --brand: #FF6B3D;
  --brand-ink: #FF855E;
  --brand-soft: rgba(255,107,61,.18);
  --up: #22C55E;
  --up-soft: rgba(34,197,94,.12);
  --up-strong: rgba(34,197,94,.25);
  --down: #EF4444;
  --down-soft: rgba(239,68,68,.12);
  --down-deep: #7F1D1D;
  --warn: #F59E0B;
  --warn-soft: rgba(245,158,11,.15);
  --info: #38BDF8;
  --info-soft: rgba(56,189,248,.15);
  --s5: #22C55E; --s4: #34D399; --s3: #F59E0B; --s2: #F87171; --s1: #EF4444;
  --t5: #10B981; --t3: #D97706; --t1: #DC2626;
  --dark: #030712;

  /* Card and Component System Tokens */
  --card-bg: #0F172A;
  --card-sub: #0B0F19;
  --card-border: #1E293B;
  --card-border-sub: #334155;
  --card-shadow: 0 4px 12px rgba(0,0,0,0.3);

  /* MCP Suite Tokens */
  --mcp-banner-bg: linear-gradient(135deg, rgba(2,132,199,0.18) 0%, rgba(234,88,12,0.14) 100%);
  --mcp-banner-border: #2E3C56;
  --mcp-box-bg: #0F172A;
  --mcp-box-border: #1E293B;
  --mcp-tile-bg: #1E293B;
  --mcp-tile-border: #334155;
}

[data-theme="dark"] .sb-logo path[fill="#190004"],
[data-theme="dark"] .sb-logo g[fill="#000"] path {
  fill: #FFFFFF !important;
}
[data-theme="dark"] .logo-msb {
  background: var(--sub2);
  box-shadow: inset 0 0 0 1px var(--line2);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 12px/16px var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:3px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:0}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.cap{font-size:12px;font-weight:700;line-height:16px;text-transform:uppercase;letter-spacing:0;color:var(--ink)}
svg{display:block}
svg text{font-family:var(--sans)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.sb{width:200px;flex:none;border-right:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.sb-logo{height:64px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.sb-logo>svg{display:block;width:126px;height:32px}
.sb-group{flex:none}
.sb-group h6{margin:0;padding:8px 16px;font-size:10px;line-height:16px;font-weight:600;color:var(--ink4);letter-spacing:0;text-transform:uppercase;border-bottom:1px solid var(--line)}
.sb-items{padding-bottom:17px;border-bottom:1px solid var(--line)}
.sb a{display:flex;gap:12px;align-items:center;height:36px;padding:0 16px;color:var(--ink2);text-decoration:none;font-size:12px;line-height:16px;cursor:pointer}
.sb a svg{width:16px;height:16px;flex:none;stroke:var(--ink2)}
.sb a:hover{background:var(--hover);color:var(--ink)}
.sb a.on{color:var(--brand);font-weight:500} .sb a.on svg{stroke:var(--brand)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:52px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.hist-g{display:flex;gap:4px;align-items:center}
.navbtn{width:24px;height:28px;border-radius:4px;display:grid;place-items:center;color:var(--ink);background:var(--sub)}
.navbtn:hover{background:var(--sub2)}
.navbtn.dis{background:var(--sub2);color:var(--ink4)}
.burger{display:none}
.top-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.top-r>.grp8{display:flex;gap:8px;align-items:center}
.search{position:relative}
.search input{width:260px;height:32px;border:1px solid var(--line);border-radius:99px;padding:0 12px 0 36px;background:var(--sub);outline:none;font-size:14px;line-height:20px}
.search input::placeholder{color:var(--ink4)}
.search input:focus{background:var(--bg);border-color:var(--line2)}
.search svg{position:absolute;left:12px;top:8px;width:16px;height:16px;stroke:var(--ink2)}
.suggest{position:absolute;top:38px;right:0;width:320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(20,20,20,.12);padding:6px;z-index:60}
.suggest button{display:flex;width:100%;gap:10px;align-items:center;padding:8px;border-radius:4px;text-align:left;font-size:12px}
.suggest button:hover,.suggest button.act{background:var(--sub)}
.suggest b{font-family:var(--mono);font-size:12px;font-weight:500;width:40px}
.pill{height:32px;display:inline-flex;align-items:center;gap:4px;padding:0 12px 0 8px;border:1px solid var(--line2);border-radius:99px;font-weight:600;font-size:14px;line-height:20px;background:var(--sub);white-space:nowrap}
.pill:hover{background:var(--sub2)}
.user{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:999px;background:var(--sub);font-size:12px;font-weight:500;white-space:nowrap}
.user i{font-style:normal;background:var(--dark);color:#fff;font-size:10px;font-weight:600;width:22px;height:22px;border-radius:2px;display:grid;place-items:center}
.user span{color:var(--ink3);font-weight:400}
#view{flex:1;min-width:0}

/* ---------- common atoms ---------- */
/* category chip (10/600, square) */
.tag{display:inline-flex;align-items:center;padding:4px 8px;font-size:10px;line-height:16px;font-weight:600;background:var(--sub);color:var(--ink2);white-space:nowrap}
/* Tag component (12/500, radius 4) */
.tg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:500;background:var(--sub);color:var(--ink2);white-space:nowrap;font-family:var(--sans)}
.tg.g{background:var(--up-soft);color:var(--up)}
.tg.r{background:var(--down-soft);color:var(--down)}
.tg.o{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:99px;font-size:12px;line-height:16px;font-weight:500;background:var(--sub);color:var(--ink);white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip:hover{background:var(--sub2)}
.chip.on{background:var(--brand-soft);color:var(--brand)}
.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 12px;border-radius:99px;font-weight:600;font-size:14px;line-height:20px;border:1px solid var(--line2);background:var(--sub);white-space:nowrap}
.btn:hover{background:var(--sub2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.sm{height:32px}
.btn.xs{height:28px;padding:0 10px;border-radius:0;border-color:var(--line);background:var(--bg);font-weight:400;font-size:12px;line-height:16px}
.btn.xs:hover{background:var(--sub)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand);font-weight:500;border-radius:4px;padding:0 12px 0 8px}
.btn.ghost:hover{background:var(--brand-soft)}
.seg{display:inline-flex;background:var(--sub);border-radius:4px;padding:2px}
.seg button{height:28px;padding:0 12px;border-radius:3px;font-size:12px;line-height:16px;color:var(--ink2)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide{display:flex}
.seg.wide button{flex:1;height:32px}
.subtabs{display:flex;gap:24px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.subtabs button{height:40px;font-size:14px;line-height:20px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--ink);font-weight:500;border-color:var(--brand)}
.check{width:14px;height:14px;border:1px solid #D0D0D1;border-radius:2.33px;display:inline-grid;place-items:center;background:var(--bg);flex:none;vertical-align:middle}
.check.on{background:var(--brand);border-color:var(--brand)}
.check.on::after{content:"";width:7px;height:3.5px;border:1.6px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.info-i{display:inline-grid;place-items:center;width:12px;height:12px;border:1px solid var(--ink3);border-radius:50%;font-size:8px;line-height:1;color:var(--ink3);font-weight:600;cursor:help;vertical-align:middle}

/* panels */
.panel{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;min-height:48px;padding:16px 20px 12px}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:12px}
.pb{padding:0 20px 16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:12px;line-height:16px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:500;text-align:right}

/* tables */
.tscroll{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:12px;line-height:16px}
.t th{font-weight:500;color:var(--ink3);text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;line-height:16px;background:var(--bg)}
.t th.s{cursor:pointer;user-select:none}
.t th.s:hover{color:var(--ink)}
.t th.sorted{color:var(--ink)}
.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t .rt{text-align:right}
.t tr.hl td{background:var(--brand-soft)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--hover)}
.t tr.sel td{background:var(--sub)}
.t .wrap{white-space:normal}
.t.upper th{text-transform:uppercase}
.t td.num,.t .num{font-size:12px;font-weight:500}
.t.hd th{background:var(--sub);border-bottom-color:var(--line2);height:40px;padding-top:0;padding-bottom:0}
.t.lg td{font-size:14px;line-height:20px}
.t.lg td.num,.t.lg .num{font-size:14px}

/* ---------- Company 360 header ---------- */
.stock-h{display:flex;align-items:center;align-self:stretch;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.logo-msb{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.logo-msb img{width:42px;height:42px;display:block}
.sym-block{display:flex;flex-direction:column;gap:4px;flex:none;min-width:0}
.sym{display:flex;align-items:center;gap:8px}
.sym h1{margin:0;font-size:20px;font-weight:600;letter-spacing:0;line-height:28px}
.sym .dd{display:flex;align-items:center;gap:4px;cursor:pointer;position:relative}
.sym .dd svg{width:16px;height:16px}
.sub-l{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:14px;line-height:20px;white-space:nowrap}
.sub-l span+span{color:var(--ink3)}
.sub-l i{width:1px;height:11px;background:var(--line2);flex:none}
.follow{height:30px;padding:2px 12px 2px 4px;border:1px solid #E6E6E6;border-radius:9999px;display:inline-flex;align-items:center;gap:0;font-size:12px;line-height:16px;font-weight:500;background:var(--hover);margin-left:auto}
.follow svg{width:16px;height:16px;margin:4px}
.follow:hover{background:var(--sub)}
.follow.on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.follow.on svg{stroke:var(--brand)}
.price-b{flex:none;padding-left:24px;border-left:1px solid var(--line);color:var(--up)}
.price-b .p{font-family:var(--mono);font-size:24px;font-weight:600;line-height:36px}
.price-b .c{font-family:var(--mono);font-size:12px;font-weight:500;line-height:16px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 460px;border-bottom:1px solid var(--line)}
.metrics>div{padding:16px 20px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:12px}
.metrics>div:last-child{border-right:0;padding-bottom:0}
.metrics .kls{display:flex;flex-direction:column;gap:8px}
.metrics .kl{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:16px}
.metrics .kl span:first-child{color:var(--ink2)}
.metrics .kl span:last-child{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.ev-list{height:124px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:8px;padding-bottom:12px}
.ev-list div{display:flex;gap:12px;font-size:12px;line-height:16px}
.ev-list b{font-family:var(--mono);font-weight:500;color:var(--brand);flex:none}
.ev-list span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.tabs{display:flex;gap:28px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);z-index:20}
.tabs button{padding:16px 0 12px;font-size:12px;line-height:16px;font-weight:700;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:0}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.tabs button:hover{color:var(--ink)}
.tabs button.on:hover{color:var(--brand)}

/* overview */
.sec-h{display:flex;align-items:center;gap:8px;padding:16px 20px 12px}
.sec-h .ln{flex:1}
.sec-h .r{color:var(--ink3);font-size:12px}
.eval{display:grid;grid-template-columns:340px repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.eval>div{border-right:1px solid var(--line);padding:20px 20px 16px;min-width:0}
.eval>div:last-child{border-right:0}
.gauge-card{display:flex;flex-direction:column;align-items:center;gap:16px;justify-content:center}
.gauge-card p{margin:0;font-size:12px;line-height:18px;color:var(--ink);text-align:center}
.gauge-card p b{font-weight:500}
.factor{display:flex;flex-direction:column;gap:12px;cursor:default}
.factor .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.factor .hd b{font-weight:500;font-size:14px;line-height:20px}
.factor .hd span{font-size:12px;color:var(--ink3);white-space:nowrap}
.factor .sc{display:flex;align-items:baseline;gap:4px}
.factor .sc .n{font-family:var(--mono);font-size:24px;line-height:36px;font-weight:600}
.factor .sc .n small{font-size:12px;line-height:16px;color:var(--ink3);font-weight:500;margin-left:4px}
.factor .sc .lb{margin-left:auto;font-size:12px;line-height:16px;font-weight:500;text-transform:uppercase}
.bar{height:4px;background:var(--sub2);overflow:hidden}
.bar i{display:block;height:100%}
.factor ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:16px;color:var(--ink2);display:grid;gap:8px}
.factor ul li::before{content:"•  "}
.factor .note{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--ink3)}
.hl3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.hl3>div{padding:16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.hl3>div:last-child{border-right:0}
.hl3 ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hl3 li{display:flex;gap:12px;font-size:12px;line-height:16px;color:var(--ink2)}
.hl3 li svg{width:14px;height:14px;flex:none;margin-top:1px}
.an4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.an4>div{padding:16px 20px;border-right:1px solid var(--line);min-width:0}
.an4>div:last-child{border-right:0}
.chg-list>div{display:flex;justify-content:space-between;align-items:center;height:50px;padding:12px 0;border-top:1px solid var(--line);font-size:12px;line-height:16px}
.chg-list>div:first-child{border-top:0}
.chg-list .v{text-align:right;font-family:var(--mono);font-weight:500;font-size:12px;line-height:16px}
.chg-list .v small{display:block;font-size:10px;line-height:12px;color:var(--ink3);font-family:var(--sans);font-weight:400}
.kpi4{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:12px 0}
.kpi4>div{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.kpi4>div:nth-child(2n){border-right:0}
.kpi4>div:nth-child(n+3){border-bottom:0}
.kpi4 span{font-size:12px;line-height:16px;color:var(--ink3)}
.kpi4 b{display:block;font-family:var(--mono);font-size:18px;line-height:28px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--ink2);justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.chart-tip{position:fixed;pointer-events:none;background:var(--dark);color:#fff;font-size:12px;line-height:16px;padding:6px 8px;border-radius:4px;z-index:90;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.chart-tip b{font-family:var(--mono);font-weight:500}
.pos-t th{background:var(--sub);height:32px;padding:0 12px;border-bottom:0;font-weight:500}
.pos-t td{padding:8px 12px;font-size:12px}

/* trading */
.trade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.15fr) minmax(0,1.05fr)}
.news-li{display:flex;gap:12px;padding:8px 20px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.news-li:hover{background:var(--hover)}
.news-li .tag{min-width:92px;justify-content:center;flex:none}
.news-li p{margin:0;font-size:12px;line-height:16px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranges{display:flex;gap:2px;flex-wrap:wrap;padding:6px 12px;border-top:1px solid var(--line);align-items:center}
.ranges button{font-size:12px;line-height:16px;padding:4px 8px;border-radius:4px;color:var(--ink2)}
.ranges button.on{background:var(--sub);color:var(--ink);font-weight:500}
.ranges .r{margin-left:auto;font-size:12px;color:var(--ink3);font-family:var(--mono)}
.ohlc{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px 0;font-size:12px;color:var(--ink2)}
.ohlc b{font-family:var(--mono);font-weight:500}
.depth-bar{display:flex;height:6px;overflow:hidden;margin:12px 0 6px}
.mb{font-weight:600}
.t.sm th{font-size:10px;font-weight:600;padding:5px 8px;color:var(--ink3)}
.t.sm td{padding:6px 8px}

.c-left .t td,.c-left .t th{padding:8px 6px}
.c-left .t td:first-child,.c-left .t th:first-child{padding-left:20px}
/* profile */
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.intro p{margin:0 0 12px;font-size:12px;color:var(--ink2);line-height:16px}
.intro h5{margin:12px 0 8px;font-size:12px;font-weight:500}
.mile{display:flex;gap:12px;font-size:12px;line-height:16px;color:var(--ink2);padding:4px 0}
.mile b{font-family:var(--mono);font-weight:500;color:var(--brand);min-width:86px}

/* shareholders */
.sh{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr)}
.donut-wrap{display:flex;align-items:center;gap:28px;padding:8px 0 4px;flex-wrap:wrap}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--ink2);padding:6px 0;min-width:170px;cursor:default}
.leg-row i{width:9px;height:9px;border-radius:2px}
.leg-row b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--ink)}

/* finance */
.fin{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr)}
.fin-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.fin-bar .r{margin-left:auto;color:var(--ink2);font-size:14px;line-height:20px}
table.fin-t th{text-align:right}
table.fin-t th:first-child{text-align:left}
table.fin-t thead tr:first-child th{color:var(--ink);font-weight:500;font-size:14px;line-height:20px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
table.fin-t thead tr:first-child th:first-child{border-left:0;text-align:left;vertical-align:bottom;color:var(--ink2);font-weight:400}
table.fin-t thead tr:nth-child(2) th{font-weight:400;color:var(--ink2)}
table.fin-t td{text-align:right;font-size:14px;line-height:20px}
table.fin-t td.num{font-size:14px}
table.fin-t td:first-child{text-align:left;color:var(--ink2);padding-left:20px}
table.fin-t th:first-child{padding-left:20px}
table.fin-t td.g0{border-left:1px solid var(--line)}
table.fin-t thead tr:nth-child(2) th.g0{border-left:1px solid var(--line)}
table.fin-t tbody tr:hover td{background:var(--hover)}
.lens{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.lens>div{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.lens>div:nth-child(2n){border-right:0}
.lens>div:nth-last-child(-n+2){border-bottom:0}
.lens span{font-size:12px;color:var(--ink3)}
.lens b{display:block;font-family:var(--mono);font-size:18px;line-height:28px;font-weight:600;margin:4px 0 0}
.lens small{font-size:10px;color:var(--ink3)}
.plan{display:grid;gap:12px}
.plan .l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px}
.plan .l b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.plan .bar{height:6px}

/* events */
.evs{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr)}
.evchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 20px 12px}
.evchips .sp{margin-left:auto}
.nitem{display:flex;gap:12px;padding:8px 20px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.nitem:hover{background:var(--hover)}
.nitem .d{font-size:12px;font-weight:500;color:var(--ink3);width:40px;flex:none}
.nitem .tag{width:96px;justify-content:center;flex:none}
.nitem p{margin:0;font-size:12px;line-height:16px;color:var(--ink2)}
.dropdown{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(20,20,20,.12);padding:4px;z-index:70;min-width:180px}
.menu.left{left:0;right:auto}
.menu button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:4px;font-size:12px;line-height:16px;gap:8px;align-items:center;white-space:nowrap}
.menu button:hover{background:var(--sub)}
.menu button.on{color:var(--brand);font-weight:500}

/* events extra */
.chip.m{padding:8px 12px;border-radius:0}
.evchips{justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.evc{display:flex;gap:4px;flex-wrap:wrap}
.ddin{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;background:var(--sub);font-size:14px;line-height:20px;color:var(--ink)}
.ddin svg{width:20px;height:20px;stroke:var(--ink2)}
.ev-t th{padding:7px 12px}
.ev-t td{padding:8px 12px;font-size:12px}
.peer-t th{height:40px;padding:0 12px;background:var(--sub);border-bottom-color:var(--line2)}
.peer-t td{height:36px;padding:0 12px}
.peer-t tr.hl td{background:var(--brand-soft)}

/* data export */
.xp{max-width:720px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.xp-row{display:flex;gap:12px;align-items:flex-start;padding:12px 20px;border-top:1px solid var(--line);cursor:pointer}
.xp-row:hover{background:var(--hover)}
.xp-row b{display:block;font-weight:500;font-size:12px;line-height:16px}
.xp-row span{font-size:12px;color:var(--ink2)}
.xp-opt{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fmt{padding:8px 12px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);background:var(--sub)}
.fmt.on{background:var(--brand-soft);color:var(--brand)}
.sel{height:32px;border:1px solid var(--line);padding:0 10px 0 12px;background:var(--bg);font-size:12px;margin-left:auto;min-width:300px;color:var(--ink2)}

/* ---------- screener (flat) ---------- */
.page{padding:24px 24px 90px}
.page.flat{padding:0 0 90px}
.ph1{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph1 h2{margin:0;font-size:20px;font-weight:600;line-height:28px;letter-spacing:0}
.ph1 .r{margin-left:auto}
.flat .ph1{padding:16px 24px 12px;border-bottom:1px solid var(--line);margin:0}
.mtabs{display:flex;gap:24px}
.mtabs button{font-size:12px;font-weight:700;line-height:16px;color:var(--ink2);padding:8px 0;border-bottom:2px solid transparent;text-transform:uppercase}
.mtabs button.on{color:var(--brand);border-color:var(--brand)}
.sech{display:flex;align-items:center;gap:8px;height:36px;padding:0 24px;border-bottom:1px solid var(--line)}
.sech .link{margin-left:auto}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.preset{padding:14px 24px;border-left:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;background:var(--bg);border-top:2px solid transparent;min-width:0}
.preset:first-child{border-left:0}
.preset:hover{background:var(--hover)}
.preset.on{background:var(--up-soft);border-top-color:var(--s5)}
.preset .k{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:500;line-height:16px;color:var(--ink3);text-transform:uppercase}
.preset .k span:last-child{font-family:var(--mono);font-weight:500;color:var(--ink);text-transform:none;font-variant-numeric:tabular-nums}
.preset.on .k span:first-child{color:var(--ink)}
.preset b{font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.preset.on b{color:var(--up)}
.preset p{margin:0;font-size:12px;line-height:16px;color:var(--ink3);min-height:32px}
.preset small{font-size:10px;line-height:16px;color:var(--ink3)}
.res-h{display:flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.res-h h3{margin:0;font-size:16px;font-weight:700;line-height:24px}
.res-h>.muted{font-size:12px}
.res-h .r{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink2)}
.fchips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--ink3)}
.flat .fchips{min-height:44px;padding:8px 24px;border-bottom:1px solid var(--line)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;font-size:12px;font-weight:500;color:var(--ink);background:var(--sub)}
.fchip button{font-size:10px;line-height:16px;color:var(--ink3);width:12px;height:16px;display:grid;place-items:center}
.fchip button svg{width:10px;height:10px}
.fchip button:hover{color:var(--ink)}
.fchip .bdg{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:10px;line-height:12px;border-radius:999px;height:14px;display:inline-grid;place-items:center;padding:0 4px;font-weight:600}
.fc2{display:inline-flex;align-items:stretch;gap:.5px;border-radius:4px;overflow:hidden}
.fc2>span{display:inline-flex;align-items:center;gap:4px;background:var(--sub);padding:8px 12px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink3)}
.fc2>span b{color:var(--ink);font-weight:500}
.fc2>button{background:var(--sub);width:34px;display:grid;place-items:center;color:var(--ink2)}
.fc2>button:hover{background:var(--sub2)}
.fc2>button svg{width:16px;height:16px}
.link{color:var(--brand);font-weight:500;cursor:pointer;font-size:12px;line-height:16px}
.link:hover{text-decoration:underline}
.score{display:inline-grid;place-items:center;width:44px;height:24px;font-family:var(--mono);font-size:12px;line-height:16px;font-weight:500}
.s-a{background:var(--up-strong);color:var(--t5)}.s-b{background:rgba(0,183,104,.1);color:var(--t5)}.s-c{background:rgba(229,142,2,.1);color:var(--t3)}.s-d{background:rgba(255,68,71,.1);color:var(--t1)}
.total{font-family:var(--mono);font-weight:600;font-size:18px;line-height:28px}
.rate{font-size:12px;font-weight:500}.rate.g{color:var(--t5)}.rate.o{color:var(--t3)}.rate.r{color:var(--t1)}
.scr-t td{height:48px;padding-top:0;padding-bottom:0}
.scr-t th{height:40px;padding-top:0;padding-bottom:0}
.scr-t td:first-child,.scr-t th:first-child{padding-left:24px}
.scr-t td:last-child,.scr-t th:last-child{padding-right:24px}
.nm b{display:block;font-size:14px;font-weight:500;line-height:20px}
.nm span{font-size:12px;line-height:16px;color:var(--ink3)}
.selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:52px;padding:10px 24px;border-bottom:1px solid var(--line);font-size:12px;font-weight:500}
.selbar .lg{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:10px;line-height:16px;color:var(--ink3);font-weight:400}
.selbar .lg i{display:inline-block;width:8px;height:8px;margin-right:0}
.selbar .lg span{display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.fine{font-size:12px;color:var(--ink3);line-height:16px;margin:12px 0 0;max-width:none}
.flat .fine{padding:0 24px;margin:12px 0 0}
.live{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3)}
.live .mono{color:var(--ink3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--up)}
.live button{background:var(--sub);border-radius:9999px;padding:4px;margin-left:4px;color:var(--ink2)}
.live button svg{width:12px;height:12px}
.bulk{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:4px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:16px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;line-height:20px;max-width:calc(100vw - 32px);flex-wrap:wrap}
.bulk .btn{border-color:#3A3A3A;background:#2A2A2A;color:#fff}
.bulk .btn:hover{background:#333}
.bulk .btn.pri{background:var(--brand);border-color:var(--brand)}
.bulk .x{color:#fff;font-size:12px;line-height:16px}
.bulk .x:hover{text-decoration:underline}

.all-t td{height:36px;padding:0 8px}
.all-t th.frz,.all-t td.frz{border-right:1px solid var(--line)}
.all-t td:nth-child(2){color:var(--ink)}
.ctabs-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ctabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{height:32px;padding:0 12px;border-radius:4px;font-size:14px;line-height:20px;color:var(--ink2);white-space:nowrap;flex:none}
.ctabs button:hover{background:var(--hover);color:var(--ink)}
.ctabs button.on{background:var(--sub);color:var(--ink);font-weight:500}
.ctabs-act{display:flex;gap:8px;flex:none}
@media (max-width:860px){.ctabs-row{flex-wrap:wrap}.ctabs{flex-basis:100%}}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(21,21,21,.38);z-index:80;display:flex;justify-content:flex-end}
.drawer{width:400px;max-width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12);animation:slin .2s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-h b{font-size:16px;line-height:24px;font-weight:700}
.dr-b{flex:1;overflow-y:auto;padding:16px 20px}
.dr-in{width:100%;height:32px;border:1px solid var(--line);border-radius:99px;padding:0 12px;background:var(--sub);outline:none;font-size:14px;line-height:20px;margin-bottom:12px}
.dr-in::placeholder{color:var(--ink4)}
.grp{border-bottom:1px solid var(--line)}
.grp>button{display:flex;width:100%;align-items:center;gap:8px;padding:12px 0;font-size:12px;line-height:16px;font-weight:700;text-align:left}
.grp>button .cnt{margin-left:auto;font-family:var(--mono);color:var(--ink3);font-weight:500}
.grp>button .car{transition:transform .15s;color:var(--ink3)}
.grp.open>button .car{transform:rotate(90deg)}
.grp.open>button{color:var(--brand)}
.grp .flds{padding:4px 0 16px;display:grid;gap:12px}
.fld{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;font-size:12px}
.fld>span{color:var(--ink2)}
.fld small{color:var(--ink3);display:block}
.fld select,.fld input{height:32px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:var(--bg);width:100%;font-size:12px}
.cbs{display:flex;gap:16px;flex-wrap:wrap}
.cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.crit{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--ink);padding:4px 0;cursor:pointer}
.dr-f{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.dr-f .btn{flex:1}

/* compare */


/* market overview extended styling */
.mkt-indices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
.mkt-idx-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r, 6px);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--card-shadow);
  color: var(--ink);
  transition: all 0.2s ease;
}
.mkt-idx-card:hover { border-color: var(--line2); transform: translateY(-1px); }
.mkt-idx-head { display: flex; justify-content: space-between; align-items: baseline; }
.mkt-idx-score { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.mkt-idx-chg { font-size: 13px; font-weight: 600; font-family: var(--mono); }
.mkt-idx-stats { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink3); border-top: 1px solid var(--line); padding-top: 6px; }
.mkt-breadth-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 4px 0; background: var(--line); }
.mkt-subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.mkt-subtab {
  padding: 8px 16px;
  border-radius: var(--r, 4px);
  border: 1px solid var(--line2);
  background: var(--card-bg);
  color: var(--ink2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.mkt-subtab:hover { background: var(--sub); color: var(--ink); border-color: var(--line); }
.mkt-subtab.active { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; box-shadow: 0 2px 8px rgba(228, 95, 53, 0.25); }
.mkt-pulse-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.mkt-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r, 6px);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  color: var(--ink);
  box-shadow: var(--card-shadow);
  transition: all 0.2s ease;
}
.mkt-box-title { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
.mkt-sec-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 4px;
  background: var(--card-sub);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink);
}
.mkt-sec-bar { height: 4px; border-radius: 2px; margin-top: 4px; }
.mkt-mover-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s;
}
.mkt-mover-row:hover { background: var(--hover); }
.mkt-foreign-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.mkt-foreign-kpi {
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: var(--r, 6px);
  padding: 12px;
  text-align: center;
  color: var(--ink);
}
.mkt-global-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
.mkt-global-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r, 6px);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--ink);
  box-shadow: var(--card-shadow);
  transition: all 0.2s ease;
}
.mkt-global-card b { color: var(--ink); }
.mkt-table { width: 100%; table-layout: auto !important; border-collapse: collapse; }
.mkt-table th { padding: 11px 14px; text-align: left; background: var(--sub); color: var(--ink3); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line); }

/* compare suite extended styling */
.cmp-mcp-cluster { display: inline-flex; gap: 8px; align-items: center; }
.cmp-subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.cmp-subtab {

  border: 1px solid var(--line2);
  background: var(--card-bg);
  color: var(--ink2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cmp-subtab:hover { background: var(--sub); color: var(--ink); border-color: var(--line); }
.cmp-subtab.active { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; box-shadow: 0 2px 8px rgba(228, 95, 53, 0.25); }
.cmp-drating-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(234, 88, 12, 0.12); color: #ea580c; border: 1px solid rgba(234, 88, 12, 0.3); font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
[data-theme="dark"] .cmp-drating-badge { background: rgba(234, 88, 12, 0.2); color: #fb923c; border-color: rgba(234, 88, 12, 0.4); }
.cmp-dr-grid, .cmp-val-grid, .cmp-swot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.cmp-dr-card, .cmp-val-card, .cmp-swot-card {

  color: var(--ink);

  gap: 12px;

}

.cmp-dr-head, .cmp-val-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.cmp-meter-row { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.cmp-meter-label { display: flex; justify-content: space-between; color: var(--ink2); }
.cmp-meter-track { height: 6px; border-radius: 3px; background: var(--sub2); overflow: hidden; }
.cmp-meter-fill { height: 100%; border-radius: 3px; }
.cmp-perf-wrap { border: 1px solid var(--card-border); background: var(--card-bg); border-radius: var(--r, 6px); padding: 16px; margin-bottom: 24px; box-shadow: var(--card-shadow); }
.cmp-perf-periods { display: flex; gap: 6px; margin-bottom: 16px; }

.cmp-period-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.cmp-chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; }
.cmp-lead-table { width: 100%; border-collapse: collapse; margin-top: 16px; }

.cmp-lead-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--up-soft); color: var(--up); border: 1px solid rgba(0, 146, 83, 0.25); }

.cmp-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

table.fin-t thead tr:first-child th:first-child{font-size:14px;line-height:20px;color:var(--ink2);padding:0 12px;vertical-align:middle}

.lens{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:0}

.lens b{font-family:var(--mono);font-size:24px;line-height:36px;font-weight:600;margin:0}
.lens small{font-size:12px;line-height:16px;color:var(--ink3)}
.vsi th{padding:6px 12px}
.vsi td{padding:6px 12px}
.plan{display:flex;flex-direction:column;gap:14px;padding:12px}
.plan .l{display:flex;gap:8px;font-size:12px;line-height:16px;color:var(--ink2);margin-bottom:6px}

.plan .bar{height:6px;background:var(--sub2)}
/* peers */
.peers{padding:4px}

.peer-t td.num{font-size:14px}

.peer-t tr.hl td{background:var(--brand-soft);border-bottom-color:var(--brand)}

/* events */
.evs{display:grid;grid-template-columns:minmax(0,1fr) 520px}
.evs .evchips{border-top:0}
/* data */
.xp-wrap .xp{max-width:none}
.xp-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.xp-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:0;border-bottom:1px solid var(--line);cursor:pointer}
.xp-row b{font-size:12px;line-height:16px;font-weight:500}
.xp-row span:not(.cbx){display:block;font-size:10px;line-height:16px;color:var(--ink3);margin-top:2px}
.cbx{width:16px;height:16px;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff}
.cbx.on{background:var(--brand);border-color:var(--brand)}
.xp-opt{display:flex;gap:10px;align-items:center;padding:14px;border-top:0;border-bottom:1px solid var(--line)}
.fmt{padding:8px 12px;font-size:12px;line-height:16px;font-weight:500;background:var(--sub);color:var(--ink)}
.fmt.on{background:var(--brand-soft);color:var(--brand)}
.sel{width:300px;min-width:0;height:32px;margin-left:auto;border:1px solid var(--line);background:var(--bg);padding:0 10px 0 12px;font-size:12px;color:var(--ink2)}
.xp-act{display:flex;gap:10px;align-items:center;padding:14px 14px 16px}
.sbtn{padding:10px 20px;font-size:14px;line-height:20px;font-weight:500;color:var(--ink2);border:1px solid var(--line);background:var(--bg)}
.sbtn:hover{background:var(--hover)}
.sbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.sbtn.pri:hover{background:var(--brand-ink)}
.sbtn:disabled{opacity:.5;cursor:not-allowed}
.est{margin-left:auto;font-size:12px;line-height:16px;color:var(--ink4)}
.est b{font-weight:400;color:var(--ink2)}
@media (max-width:1500px){

  .prow1{grid-template-columns:repeat(3,minmax(0,1fr))}

.wl-menu .wl-mi button.ic:hover{background:var(--sub2);color:var(--ink)}

.modal.wl-modal{border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:24px;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.18);position:relative}

.wm-x:hover{background:var(--sub)}
.wm-skip{font-size:14px;line-height:20px;font-weight:600;color:var(--ink2)}

.wm-b{display:flex;flex-direction:column;gap:16px;position:relative}

.wm-sug span{flex:1;color:var(--ink2);font-size:12px}
.wm-sug small{font-size:10px;color:var(--ink3)}

[data-theme="dark"] .mcp-tag.fin {
  color: #34d399;
  background: rgba(5, 150, 105, 0.22);
  border-color: rgba(52, 211, 153, 0.35);
}

.dnse-mcp-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--line2);
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--card-shadow);
  margin-left: 10px;
}
.dnse-mcp-badge:hover {
  border-color: #0284c7;
  background: var(--sub);
  transform: translateY(-1px);
}
.dnse-mcp-badge .mcp-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 6px #22c55e;
  animation: mcpPulse 1.8s infinite;
}
@keyframes mcpPulse {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.8; }
}
.dnse-mcp-badge .mcp-info {
  display: flex;
  flex-direction: column;
}
.dnse-mcp-badge .mcp-title {
  font-size: 11px;
  font-weight: 700;
  color: #0284c7;
  letter-spacing: 0.3px;
}
[data-theme="dark"] .dnse-mcp-badge .mcp-title {
  color: #38bdf8;
}
.dnse-mcp-badge .mcp-sub {
  font-size: 9px;
  color: var(--ink3);
  font-family: var(--mono);
}
.dnse-mcp-badge .mcp-btn {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  background: #0284c7;
  color: #fff;
  border: 0;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.dnse-mcp-badge .mcp-btn:hover {
  background: #0369a1;
}

/* MCP BANNER COMPONENT */
.dnse-sync-banner {
  background: var(--mcp-banner-bg);
  border: 1px solid var(--mcp-banner-border);
  border-radius: var(--r, 6px);
  padding: 12px 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--card-shadow);
  transition: all 0.2s ease;
}
.dnse-sync-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.dnse-icon {
  font-size: 20px;
  line-height: 1;
}
.dnse-sync-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
}
.dnse-sync-desc {
  font-size: 11px;
  color: var(--ink2);
  margin-top: 4px;
  line-height: 1.5;
}
.dnse-sync-desc code {
  background: var(--sub);
  color: #0284c7;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 10px;
  border: 1px solid var(--line);
}
[data-theme="dark"] .dnse-sync-desc code {
  color: #38bdf8;
}
.dnse-brand-text {
  color: #0284c7;
}
[data-theme="dark"] .dnse-brand-text {
  color: #38bdf8;
}
.vnd-brand-text {
  color: #ea580c;
}
[data-theme="dark"] .vnd-brand-text {
  color: #fb923c;
}
.rec-text, .upside-text {
  color: var(--up);

}
.tgt-text {
  color: #0284c7;
  font-weight: 700;
}
[data-theme="dark"] .tgt-text {
  color: #38bdf8;
}
.mcp-tag {

  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
}
.mcp-tag.dnse {
  background: rgba(2,132,199,0.12);
  color: #0284c7;
  border: 1px solid rgba(2,132,199,0.25);
}
[data-theme="dark"] .mcp-tag.dnse {
  background: rgba(2,132,199,0.25);
  color: #38bdf8;
  border: 1px solid rgba(56,189,248,0.3);
}
.mcp-tag.vnd {
  background: rgba(234,88,12,0.12);
  color: #ea580c;
  border: 1px solid rgba(234,88,12,0.25);
}
[data-theme="dark"] .mcp-tag.vnd {
  background: rgba(234,88,12,0.25);
  color: #fb923c;
  border: 1px solid rgba(251,146,60,0.3);
}
.mcp-tag-sym {
  color: var(--brand);
  font-weight: 800;
  font-size: 13px;
}
.dnse-sync-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.dnse-action-btn {
  font-size: 11px;
  font-weight: 600;
  font-family: var(--sans);
  padding: 6px 12px;
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line2);
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.dnse-action-btn:hover {
  background: var(--sub);
  border-color: var(--line);
}
.dnse-action-btn.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.dnse-action-btn.primary:hover {
  background: var(--brand-ink);
}

/* MCP DETAIL WIDGET CARDS (D-RATING & CONSENSUS) */
.mcp-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r, 6px);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--card-shadow);
  transition: all 0.2s ease;
}
.mcp-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mcp-card-title {
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.mcp-card-title.vnd {
  color: #ea580c;
}
[data-theme="dark"] .mcp-card-title.vnd {
  color: #fb923c;
}
.mcp-card-title.consensus {
  color: #0284c7;
}
[data-theme="dark"] .mcp-card-title.consensus {
  color: #38bdf8;
}
.mcp-card-badge {
  font-size: 12px;
  font-weight: 700;
  color: #d97706;
}
[data-theme="dark"] .mcp-card-badge {
  color: #facc15;
}
.mcp-card-sub {
  font-size: 10.5px;
  color: var(--ink3);
}
.mcp-tiles-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  font-size: 11px;
}
.mcp-tile {
  background: var(--card-sub);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mcp-tile span {
  color: var(--ink3);
}
.mcp-tile b {
  color: var(--ink);
  font-family: var(--mono);
}
.mcp-consensus-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card-sub);
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 4px;
}
.mcp-consensus-box .lbl {
  font-size: 10px;
  color: var(--ink3);
  text-transform: uppercase;
}
.mcp-consensus-box .val {
  font-size: 13px;
  font-weight: 800;
  margin-top: 1px;
}
.mcp-consensus-box .val.rec {
  color: var(--up);
}
.mcp-consensus-box .val.tgt {
  color: #0284c7;
  font-family: var(--mono);
}
[data-theme="dark"] .mcp-consensus-box .val.tgt {
  color: #38bdf8;
}
.mcp-consensus-box .upside {
  font-size: 10px;
  color: var(--up);
  font-family: var(--sans);
  font-weight: 600;
}
.mcp-card-foot {
  font-size: 10.5px;
  color: var(--ink3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 2px;
}
.mcp-card-foot b {
  color: var(--ink);
  font-family: var(--mono);
}

/* MODAL DNSE & DUAL MCP */
#modal-dnse-mcp {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
}

  display: flex;
}
.dnse-modal-card {
  background: var(--bg);

  width: 780px;
  max-width: 95vw;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  overflow: hidden;
  color: var(--ink);

}

  font-size: 13px;

.dnse-json-pre {

function makeCandles(targetPrice, seed) {
  const r = rng(seed || 7), out = []; const n = 1300;
  const targetPriceVal = targetPrice || (typeof STOCK !== 'undefined' && STOCK ? STOCK.price : 14250);
  const ratio = targetPriceVal / 14250;
  const d0 = new Date(2021, 8, 20);
  const days = []; for (let d = new Date(d0); days.length < n; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w && w < 6) days.push(new Date(d)); }
  const k0 = n - 520;
  const old = t => 11800 - 1800 * Math.sin(t * 3.1) * (1 - t) + 2600 * Math.pow(t, 1.7);
  const path = i => i >= k0 ? old((i - k0) / 519) : (u => 15600 - 7200 * Math.sin(u * 2.2) * (u < .55 ? 1 : 1) + 3200 * Math.pow(u, 2.4) - 1500 * u)(i / k0) * (i / k0 > .92 ? 1 : 1);
  let p = path(0);
  for (let i = 0; i < n; i++) {
    const tgt = path(i);
    const o = p; p = p + (tgt - p) * 0.08 + (r() - .5) * 260;
    let c = Math.round(p / 50) * 50; if (i === n - 1) c = tgt;
    const hi = Math.max(o, c) + r() * 180, lo = Math.min(o, c) - r() * 180;
    const scO = Math.round((o * ratio) / 50) * 50;
    const scC = Math.round((c * ratio) / 50) * 50;
    const scH = Math.max(scO, scC, Math.round((hi * ratio) / 50) * 50);
    const scL = Math.min(scO, scC, Math.round((lo * ratio) / 50) * 50);
    const vol = Math.round((2.5 + r() * 6 + (r() > .93 ? 9 : 0)) * 1e6);
    out.push({ d: days[i], o: scO, h: scH, l: scL, c: scC, v: vol });
    p = c;
  }
  const curP = targetPriceVal;
  const pv = out[n - 2];
  const prevP = Math.round((curP * 0.99) / 50) * 50;
  pv.c = prevP; pv.h = Math.max(pv.h, pv.o, prevP); pv.l = Math.min(pv.l, pv.o, prevP);
  Object.assign(out[n - 1], {
    o: Math.round((curP * 0.995) / 50) * 50,
    h: Math.round((curP * 1.008) / 50) * 50,
    l: Math.round((curP * 0.992) / 50) * 50,
    c: curP,
    v: 8462300
  });
  return out;
}

function annualRows(key) {
  const k = FIN[key], flow = key === 'is' || key === 'cf';
  const growth = [0.62, 0.71, 0.80, 0.90, 1];
  return k.q.map(row => {
    const lbl = row[0], last = row[5], q4 = row[4];
    if (typeof last[0] === 'string') {
      const base = parseFloat(last[0].replace(',', '.'));
      const vals = [-.9, -.6, -.4, -.2, 0].map((d, i) => +(base + d * (i % 2 ? 1 : 1.1)).toFixed(1));
      return [lbl, ...vals.map((v, i) => [fmtVN(v, 1) + '%', i ? +(v - vals[i - 1]).toFixed(1) : null, 'pp'])];
    }
    const yearVal = flow ? (row.slice(1).slice(0, 4).reduce((a, c) => a + c[0], 0)) : q4[0];
    const vals = growth.map(g => Math.round(yearVal * g));
    return [lbl, ...vals.map((v, i) => [v, i ? +((v / vals[i - 1] - 1) * 100).toFixed(1) : null])];
  });
}

/* (a) trạng thái CW theo ngày xem */
function cwStatus(x, D) {
  if (D <= x.ltdN) return { k: 'live', l: 'Đang giao dịch' };
  if (D <= x.matN) return { k: 'halt', l: 'Ngừng giao dịch' };
  if (D < x.payN) return { k: 'wait', l: 'Đã đáo hạn – chờ thanh toán' };
  return { k: 'paid', l: 'Đã thanh toán' };
}

}
/* dữ liệu thị trường của mã tại ngày xem (null = nguồn không có dữ liệu) */
function instrMkt(x, D) {
  if (x.nodata) return null;
  if (x.type === 'ETF') return { p: x.last, c: x.c, kl: x.kl, gt: x.gt, dl: x.dl, dh: x.dh, wl: x.wl, wh: x.wh };
  const st = cwStatus(x, D).k;
  if (st === 'live') return { p: x.last, c: x.c, kl: x.kl, gt: x.gt, dl: x.dl, dh: x.dh };
  if (st === 'halt') return { p: x.last, c: null, kl: null, gt: null };  /* chỉ còn giá đóng cửa phiên cuối */
  return null;
}

const P = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
function arcPath(cx, cy, r, a0, a1) { const [x0, y0] = P(cx, cy, r, a0), [x1, y1] = P(cx, cy, r, a1); const large = Math.abs(a0 - a1) > 180 ? 1 : 0; return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function gauge(score) {
  const cx = 120, cy = 112, r = 92, A0 = 210, SW = 240, cols = ['#CC3639', '#FF4447', '#E58E02', '#E58E02', '#00B768', '#009253'];
  const segs = [[0, 30, cols[0]], [30, 50, cols[2]], [50, 68, cols[3]], [68, 84, cols[4]], [84, 100, cols[5]]];
  let s = segs.map(([a, b, c]) => `<path d="${arcPath(cx, cy, r, A0 - SW * a / 100 - (a ? 1.5 : 0), A0 - SW * b / 100 + (b < 100 ? 1.5 : 0))}" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/>`).join('');
  s += `<path d="${arcPath(cx, cy, 70, A0, A0 - SW)}" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="2 4" fill="none"/>`;
  const [kx, ky] = P(cx, cy, r, A0 - SW * score / 100);
  s += `<circle cx="${kx}" cy="${ky}" r="9" fill="#fff" stroke="#009253" stroke-width="3"/>`;
  s += `<text x="${cx - 6}" y="${cy + 4}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="34" font-weight="600" fill="#151515">${score}</text><text x="${cx - 2}" y="${cy + 4}" font-family="JetBrains Mono,monospace" font-size="13" fill="#737373">/100</text><text x="${cx}" y="${cy + 24}" text-anchor="middle" font-size="12" fill="#5B5B5B">Điểm tổng hợp</text>`;
  return `<svg width="240" height="150" viewBox="0 0 240 150" role="img" aria-label="Điểm tổng hợp ${score}/100">${s}</svg>`;
}

function getStockValuationData() {
  const valMetrics = (typeof STOCK !== 'undefined' && STOCK.metrics && STOCK.metrics.val) ? STOCK.metrics.val : [];
  const pbItem = valMetrics.find(x => x[0].includes('P/B'));
  const roeItem = valMetrics.find(x => x[0].includes('ROE'));
  const peItem = valMetrics.find(x => x[0].includes('P/E'));

  let pbVal = pbItem ? parseFloat(pbItem[1].replace(/[^\d.,]/g, '').replace(',', '.')) : 1.15;
  let roeVal = roeItem ? roeItem[1] : '18,2%';
  let peVal = peItem ? parseFloat(peItem[1].replace(/[^\d.,]/g, '').replace(',', '.')) : 7.41;

  // Industry Benchmarks (P/B, P/E, Percentile) based on sector
  let indPb = 1.82;
  let indPe = 11.25;
  let percentile = '42%';
  let evEbitda = '9,20';
  let ps = '2,35';

  const sym = (typeof STOCK !== 'undefined' ? STOCK.sym : 'MSB');
  const ind = (typeof STOCK !== 'undefined' && STOCK.ind ? STOCK.ind.toLowerCase() : '');

  if (sym === 'FPT' || ind.includes('công nghệ') || ind.includes('phần mềm')) {
    indPb = 3.80;
    indPe = 22.10;
    percentile = '68%';
    evEbitda = '16,20';
    ps = '3,45';
  } else if (sym === 'HPG' || ind.includes('thép') || ind.includes('kim loại')) {
    indPb = 1.65;
    indPe = 14.80;
    percentile = '48%';
    evEbitda = '8,20';
    ps = '1,25';
  } else if (sym === 'VNM' || ind.includes('thực phẩm') || ind.includes('sữa')) {
    indPb = 2.80;
    indPe = 18.50;
    percentile = '52%';
    evEbitda = '10,50';
    ps = '2,25';
  } else if (ind.includes('chứng khoán') || ind.includes('đầu tư')) {
    indPb = 1.55;
    indPe = 13.80;
    percentile = '50%';
    evEbitda = '11,40';
    ps = '2,80';
  } else if (ind.includes('ngân hàng')) {
    indPb = 1.62;
    indPe = 11.25;
    percentile = '38%';
    evEbitda = '7,80';
    ps = '2,10';
  }

  return { pbVal, roeVal, peVal, indPb, indPe, percentile, evEbitda, ps };
}

function radar() {
  const cx = 140, cy = 112, R = 72, n = 6, ang = i => 90 - i * 360 / n;
  let g = '';
  for (let k = 1; k <= 4; k++) { const pts = [...Array(n)].map((_, i) => P(cx, cy, R * k / 4, ang(i)).map(v => v.toFixed(1)).join(',')).join(' '); g += `<polygon points="${pts}" fill="none" stroke="var(--border, #E8E8E8)"/>`; }
  for (let i = 0; i < n; i++) { const [x, y] = P(cx, cy, R, ang(i)); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border, #E8E8E8)"/>`; }
  const poly = (arr, st, fill, dash) => `<polygon points="${arr.map((v, i) => P(cx, cy, R * v / 100, ang(i)).map(z => z.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="${st}" stroke-width="1.6" ${dash ? 'stroke-dasharray="4 3"' : ''}/>`;
  g += poly(RADAR.ind, '#E58E02', 'none', 1) + poly(RADAR.msb, '#009253', 'rgba(12,154,87,.08)');
  const curSym = typeof STOCK !== 'undefined' ? STOCK.sym : 'CP';
  RADAR.msb.forEach((v, i) => { const [x, y] = P(cx, cy, R * v / 100, ang(i)); g += `<circle cx="${x}" cy="${y}" r="3" fill="#009253" data-tip="${esc(RADAR.axes[i])}: ${curSym} <b>${v}</b> · Ngành <b>${RADAR.ind[i]}</b>"/>`; });
  RADAR.axes.forEach((a, i) => {
    const [x, y] = P(cx, cy, R + 16, ang(i)); const anc = Math.abs(x - cx) < 5 ? 'middle' : x > cx ? 'start' : 'end';
    const dy = y < cy - 40 ? -12 : y > cy + 40 ? 6 : -4;
    g += `<text x="${x}" y="${y + dy}" text-anchor="${anc}" font-size="10.5" fill="var(--ink2, #5B5B5B)">${a}</text><text x="${x}" y="${y + dy + 12}" text-anchor="${anc}" font-size="10.5" fill="#009253" font-family="JetBrains Mono,monospace">${RADAR.msb[i]}</text>`;
  });
  return `<svg viewBox="0 0 280 230" width="100%" style="max-width:300px;margin:auto" role="img" aria-label="Radar sức khỏe tài chính">${g}</svg>`;
}

function pbChart() {
  const W = 380, H = 160, l = 32, r = 8, t = 10, b = 24, n = 37;
  const valData = getStockValuationData();
  const curSym = typeof STOCK !== 'undefined' ? STOCK.sym : 'CP';
  const pbBase = valData.pbVal;
  const indBase = valData.indPb;

  const pb = [...Array(n)].map((_, i) => {
    const ratio = 1 + 0.16 * Math.sin(i / 3.2) + 0.04 * Math.sin(i * 1.3) - (i > 33 ? 0.03 : 0);
    return Math.max(0.4, +(pbBase * (0.90 + 0.10 * (i / n)) * ratio / 1.03).toFixed(2));
  });
  pb[n - 1] = pbBase;

  const ind = [...Array(n)].map((_, i) => {
    return Math.max(0.4, +(indBase * (0.96 + 0.04 * Math.sin(i / 2.6))).toFixed(2));
  });
  ind[n - 1] = indBase;

  const allVals = [...pb, ...ind];
  const minVal = Math.min(...allVals);
  const maxVal = Math.max(...allVals);
  const span = maxVal - minVal || 1;
  const y0 = Math.max(0, +(minVal - span * 0.22).toFixed(1));
  const y1 = +(maxVal + span * 0.22).toFixed(1);
  const step = +((y1 - y0) / 4).toFixed(1) || 0.5;
  const yTicks = [y0, +(y0 + step).toFixed(1), +(y0 + 2 * step).toFixed(1), +(y0 + 3 * step).toFixed(1), y1];

  const X = i => l + (W - l - r) * i / (n - 1);
  const Y = v => t + (H - t - b) * (1 - (v - y0) / (y1 - y0 || 1));

  let g = '';
  yTicks.forEach(v => g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border, #E8E8E8)"/><text x="${l - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="9" fill="var(--ink3, #737373)" font-family="JetBrains Mono,monospace">${fmtVN(v, 1)}</text>`);

  const bandMargin = indBase * 0.09;
  const band = ind.map((v, i) => `${X(i)},${Y(v + bandMargin)}`).join(' ') + ' ' + ind.map((v, i) => `${X(i)},${Y(Math.max(y0, v - bandMargin))}`).reverse().join(' ');
  g += `<polygon points="${band}" fill="rgba(20,166,250,.12)"/>`;
  g += `<polyline points="${ind.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="#14A6FA" stroke-width="1.3" stroke-dasharray="4 3"/>`;
  g += `<polyline points="${pb.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="#E58E02" stroke-width="1.8"/>`;
  g += `<circle cx="${X(n - 1)}" cy="${Y(pb[n - 1])}" r="3.5" fill="#E58E02"/>`;

  ['08/2023', '02/2024', '08/2024', '02/2025', '08/2025', '02/2026', '08/2026'].forEach((d, k) => g += `<text x="${X(k * 6)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 6 ? 'end' : 'middle'}" font-size="9.5" fill="var(--ink3, #737373)">${d}</text>`);
  const months = [...Array(n)].map((_, i) => { const m = (7 + i) % 12 + 1, y = 2023 + Math.floor((7 + i) / 12); return String(m).padStart(2, '0') + '/' + y; });
  g += `<line id="pbx" x1="0" x2="0" y1="${t}" y2="${H - b}" stroke="var(--ink3, #737373)" stroke-dasharray="2 2" visibility="hidden"/>`;
  g += `<rect x="${l}" y="${t}" width="${W - l - r}" height="${H - t - b}" fill="transparent" data-pb='${JSON.stringify({ sym: curSym, l, w: W - l - r, n, pb: pb.map(v => +v.toFixed(2)), ind: ind.map(v => +v.toFixed(2)), m: months })}'/>`;
  return `<svg id="pbsvg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="P/B ${curSym} so với trung bình ngành 3 năm">${g}</svg>`;
}
function donut(data, size = 150) {
  const c = size / 2, r = size / 2 - 12, tot = data.reduce((a, d) => a + d[1], 0); let a = 90, g = '';
  data.forEach((d, i) => { const sw = 360 * d[1] / tot; g += `<path d="${arcPath(c, c, r, a, a - sw + .01)}" stroke="${d[2]}" stroke-width="22" fill="none" data-seg="${i}" data-tip="${esc(d[0])}: <b>${fmtVN(d[1], 2)}%</b>" style="cursor:pointer"/>`; a -= sw; });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Cơ cấu sở hữu">${g}</svg>`;
}

/* ================= REALTIME STREAMING ENGINE (CLIENT-SIDE STREAM & WSS) ================= */
let REALTIME_ACTIVE = true;
let REALTIME_TIMER = null;
let REALTIME_SPEED_MS = 2200;
let HERO_SIDE_TAB = 'tape';
let INTRADAY_LIVE_TICKS = [];

function initRealtimeTicks(sym, basePrice) {
  basePrice = basePrice || (typeof STOCK !== 'undefined' ? STOCK.price : 14250);
  INTRADAY_LIVE_TICKS = [];
  const now = new Date();
  for (let i = 7; i >= 0; i--) {
    const t = new Date(now.getTime() - i * 3200);
    const tStr = `${t.getHours().toString().padStart(2, '0')}:${t.getMinutes().toString().padStart(2, '0')}:${t.getSeconds().toString().padStart(2, '0')}`;
    const p = basePrice + (Math.floor(Math.random() * 3) - 1) * 50;
    const v = Math.floor(Math.random() * 60 + 10) * 100;
    const side = Math.random() > 0.4 ? 'buy' : 'sell';
    INTRADAY_LIVE_TICKS.unshift({ time: tStr, price: p, vol: v, side: side });
  }
}

function renderLiveTapeRows() {
  if (!INTRADAY_LIVE_TICKS || INTRADAY_LIVE_TICKS.length === 0) {
    initRealtimeTicks(typeof STOCK !== 'undefined' ? STOCK.sym : 'MSB', typeof STOCK !== 'undefined' ? STOCK.price : 14250);
  }
  return INTRADAY_LIVE_TICKS.map((t, idx) => `
    <div class="tape-row" style="display:flex;align-items:center;justify-content:space-between;padding:3.5px 6px;border-bottom:1px dashed var(--line);font-size:11px;font-family:var(--mono);background:${idx === 0 ? 'rgba(34,197,94,0.06)' : 'transparent'}">
      <span style="color:var(--ink3);font-size:10.5px">${t.time}</span>
      <b style="color:${t.side === 'buy' ? 'var(--up)' : 'var(--down)'};font-size:11.5px">${fmtVN(t.price, 0)}</b>
      <span style="font-weight:600;color:var(--ink)">${fmtVN(t.vol, 0)} CP</span>
      <span style="font-size:9.5px;padding:1px 5px;border-radius:3px;font-weight:700;background:${t.side === 'buy' ? 'rgba(34,171,148,0.15)' : 'rgba(242,54,69,0.15)'};color:${t.side === 'buy' ? 'var(--up)' : 'var(--down)'}">
        ${t.side === 'buy' ? 'MUA ↑' : 'BÁN ↓'}
      </span>
    </div>
  `).join('');
}

function tickRealtime() {
  if (!REALTIME_ACTIVE) return;
  if (typeof S === 'undefined' || !S.route || !S.route.startsWith('c360')) return;
  if (typeof STOCK === 'undefined' || !STOCK) return;

  const oldPrice = STOCK.price;
  const refPrice = (STOCK.price - STOCK.chg) || 14100;
  const step = STOCK.price < 50000 ? 50 : 100;
  const maxDelta = Math.round(refPrice * 0.07);
  const ceilPrice = Math.round((refPrice + maxDelta) / step) * step;
  const floorPrice = Math.round((refPrice - maxDelta) / step) * step;

  // 45% unchanged, 28% +step, 27% -step
  const rnd = Math.random();
  let delta = 0;
  if (rnd < 0.28) {
    delta = step;
  } else if (rnd < 0.55) {
    delta = -step;
  }
  let newPrice = oldPrice + delta;
  if (newPrice > ceilPrice) newPrice = ceilPrice;
  if (newPrice < floorPrice) newPrice = floorPrice;

  const tickVol = Math.floor(Math.random() * 80 + 5) * 100;
  const side = (newPrice > oldPrice) ? 'buy' : (newPrice < oldPrice) ? 'sell' : (Math.random() > 0.45 ? 'buy' : 'sell');

  STOCK.price = newPrice;
  STOCK.chg = newPrice - refPrice;
  STOCK.pct = (STOCK.chg / (refPrice || 1)) * 100;

  // Add tick to live tape
  const now = new Date();
  const tStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
  INTRADAY_LIVE_TICKS.unshift({ time: tStr, price: newPrice, vol: tickVol, side: side });
  if (INTRADAY_LIVE_TICKS.length > 10) INTRADAY_LIVE_TICKS.pop();

  // 1. Update Price Header DOM with Flash
  const priceEl = document.getElementById('c360-live-price');
  const chgEl = document.getElementById('c360-live-chg');
  if (priceEl) {
    priceEl.textContent = fmtVN(newPrice, 0);
    priceEl.classList.remove('flash-up', 'flash-down');
    void priceEl.offsetWidth; // trigger reflow
    if (newPrice > oldPrice) {
      priceEl.classList.add('flash-up');
    } else if (newPrice < oldPrice) {
      priceEl.classList.add('flash-down');
    }
  }
  if (chgEl) {
    const isUp = STOCK.chg >= 0;
    chgEl.className = 'c ' + (isUp ? 'up' : 'down');
    chgEl.textContent = `${isUp ? '▲ +' : '▼ '}${fmtVN(Math.abs(STOCK.chg), 0)} (${isUp ? '+' : ''}${STOCK.pct.toFixed(2)}%)`;
  }

  // Update tvbid & tvask in TradingView header if present
  const tvbidEl = document.getElementById('tvbid');
  const tvaskEl = document.getElementById('tvask');
  if (tvbidEl) tvbidEl.textContent = fmtVN(newPrice - step, 0);
  if (tvaskEl) tvaskEl.textContent = fmtVN(newPrice, 0);

  // 2. Update Candlestick Chart (last candle)
  if (typeof CANDLES !== 'undefined' && CANDLES && CANDLES.length > 0) {
    const last = CANDLES[CANDLES.length - 1];
    last.c = newPrice;
    if (newPrice > last.h) last.h = newPrice;
    if (newPrice < last.l) last.l = newPrice;
    last.v += tickVol;
  }
  if (typeof INTRA !== 'undefined' && INTRA && INTRA.length > 0) {
    const lastI = INTRA[INTRA.length - 1];
    lastI.c = newPrice;
    if (newPrice > lastI.h) lastI.h = newPrice;
    if (newPrice < lastI.l) lastI.l = newPrice;
    lastI.v += tickVol;
  }
  if (typeof drawCandles === 'function') {
    drawCandles();
  }

  // 3. Update Live Tape DOM
  const tapeListEl = document.getElementById('hero-live-tape-list');
  if (tapeListEl && HERO_SIDE_TAB === 'tape') {
    tapeListEl.innerHTML = renderLiveTapeRows();
  }

  if (/^Trụ cột 4: Dòng tiền D-Money/.test(L)) return { tag: p.dr_money.includes('cực') || p.dr_money.includes('mẽ') ? '▲ ' + p.dr_money : '● ' + p.dr_money };
  if (/^Khuyến nghị đồng thuận/.test(L)) return { tag: p.rec.includes('MUA') ? '▲ ' + p.rec.split(' ')[0] : '● ' + p.rec.split(' ')[0] };

  // D-Rating
  if (/^Điểm D-Rating tổng thể/.test(L)) return { s: p.dr_score.toFixed(1) + ' ★ ' + p.dr_stars };
  if (/Trụ cột 1/.test(L)) return { s: p.dr_fund + ' / 100' };
  if (/Trụ cột 2/.test(L)) return { s: p.dr_val + ' / 100' };
  if (/Trụ cột 3/.test(L)) return { s: p.dr_tech + ' / 100' };

  // Targets & Forward
  if (/Số CTCK/.test(L)) return { s: String(p.coverage_count) };
  if (/Giá mục tiêu/.test(L)) return { s: p.tp.toFixed(2) };
  if (/Tiềm năng tăng giá/.test(L)) return { s: sp(p.upside, 2, '%') };
  if (/P\/E Forward/.test(L)) return { s: p.fpe.toFixed(2) };
  if (/P\/B Forward/.test(L)) return { s: p.fpb.toFixed(2) };
  if (/Định giá DCF/.test(L)) return { s: p.dcf.toFixed(2) };
  if (/Định giá PEG/.test(L)) return { s: p.peg.toFixed(2) };

  // Market & Price
  if (/^Giá hiện tại/.test(L)) return { s: p.p.toFixed(2) };
  if (/^Thay đổi trong ngày \(nghìn/.test(L)) return { s: sp(p.c, 2) };
  if (/^Thay đổi trong ngày \(%/.test(L)) return { s: sp(p.pct, 2, '%') };
  if (/^Vốn hóa/.test(L)) return { s: p.mc.toFixed(2) };
  if (/^Khối lượng giao dịch/.test(L)) return { s: p.vol };
  if (/^Giá trị giao dịch/.test(L)) return { s: p.gt.toFixed(2) };
  if (/^KL \/ TB20/.test(L)) return { s: p.kl_tb20.toFixed(2) };
  if (/^Beta/.test(L)) return { s: p.beta.toFixed(2) };
  if (/cao nhất/.test(L)) return { s: p.hi.toFixed(2) };
  if (/thấp nhất/.test(L)) return { s: p.lo.toFixed(2) };
  if (/^Vị trí trong biên/.test(L)) return { s: p.pos52.toFixed(2) + '%' };
  if (/^Sàn/.test(L)) return { s: p.ex };
  if (/^Ngành/.test(L)) return { s: p.ind };

  // Valuation
  if (/^P\/E/.test(L)) return { s: p.pe.toFixed(2) };
  if (/^P\/B/.test(L)) return { s: p.pb.toFixed(2) };
  if (/^P\/S/.test(L)) return { s: p.ps.toFixed(2) };
  if (/^P\/CF/.test(L)) return { s: p.pcf.toFixed(2) };
  if (/^P\/FCFF/.test(L)) return { s: p.pfcff.toFixed(2) };
  if (/^PEG/.test(L)) return { s: p.peg.toFixed(2) };
  if (/^Giá trị doanh nghiệp/.test(L)) return { s: p.ev.toFixed(2) };
  if (/^EV \/ Doanh thu/.test(L)) return { s: p.ev_rev.toFixed(2) };
  if (/^EV \/ EBIT\(/.test(L) || /^EV \/ EBIT /.test(L)) return { s: p.ev_ebit.toFixed(2) };
  if (/^EV \/ EBITDA/.test(L)) return { s: p.ev_ebitda.toFixed(2) };
  if (/^Tỷ suất cổ tức/.test(L)) return { s: p.div.toFixed(2) + '%' };

  // Growth
  if (/Tăng trưởng doanh thu/.test(L)) return { s: sp(p.rev_growth, 2, '%') };
  if (/Tăng trưởng EBITDA/.test(L)) return { s: sp(p.ebitda_growth, 2, '%') };
  if (/Tăng trưởng LN sau thuế/.test(L)) return { s: sp(p.np_growth, 2, '%') };
  if (/Tăng trưởng EPS/.test(L)) return { s: sp(p.eps_growth, 2, '%') };
  if (/CAGR doanh thu/.test(L)) return { s: sp(p.cagr_rev, 2, '%') };
  if (/CAGR LN ròng/.test(L)) return { s: sp(p.cagr_np, 2, '%') };

  // Profitability
  if (/Biên lợi nhuận gộp/.test(L)) return { s: p.gm.toFixed(2) + '%' };
  if (/Biên lợi nhuận hoạt động/.test(L)) return { s: p.om.toFixed(2) + '%' };
  if (/Biên lợi nhuận trước thuế/.test(L)) return { s: p.pbt_m.toFixed(2) + '%' };
  if (/Biên lợi nhuận ròng/.test(L)) return { s: p.nm.toFixed(2) + '%' };
  if (/^ROE/.test(L)) return { s: p.roe.toFixed(2) + '%' };
  if (/^ROA/.test(L)) return { s: p.roa.toFixed(2) + '%' };
  if (/^ROIC/.test(L)) return { s: p.roic.toFixed(2) + '%' };

  // Balance sheet
  if (/^Tiền mặt/.test(L)) return { s: p.cash.toFixed(2) };
  if (/^Nợ phải trả/.test(L)) return { s: p.debt.toFixed(2) };
  if (/^Vốn chủ sở hữu/.test(L)) return { s: p.equity.toFixed(2) };
  if (/^Nợ vay \/ VCSH/.test(L)) return { s: p.de.toFixed(2) };
  if (/^Hệ số thanh toán hiện hành/.test(L)) return { s: p.cr.toFixed(2) };
  if (/^Hệ số thanh toán nhanh/.test(L)) return { s: p.qr.toFixed(2) };
  if (/^Hệ số chi trả lãi vay/.test(L)) return { s: p.icr.toFixed(2) };

  // Cash flow
  if (/Dòng tiền HĐKD/.test(L)) return { s: p.cfo.toFixed(2) };
  if (/Dòng tiền tự do/.test(L)) return { s: p.fcf.toFixed(2) };
  if (/Biên FCF/.test(L)) return { s: p.fcf_m.toFixed(2) + '%' };
  if (/^CapEx —/.test(L)) return { s: p.capex.toFixed(2) };
  if (/^CapEx \/ Doanh thu/.test(L)) return { s: p.capex_rev.toFixed(2) + '%' };

  // Business results
  if (/^Kỳ báo cáo/.test(L)) return { s: p.rep_period };
  if (/^Doanh thu — TTM/.test(L)) return { s: p.ttm_rev.toFixed(2) };
  if (/^Lợi nhuận gộp — TTM/.test(L)) return { s: p.ttm_gp.toFixed(2) };
  if (/^Lợi nhuận hoạt động — TTM/.test(L)) return { s: p.ttm_op.toFixed(2) };
  if (/^Lợi nhuận sau thuế — TTM/.test(L)) return { s: p.ttm_np.toFixed(2) };
  if (/^EBITDA — TTM/.test(L)) return { s: p.ebitda.toFixed(2) };
  if (/^EPS pha loãng/.test(L)) return { s: p.eps.toLocaleString('vi-VN') };
  if (/% hoàn thành KH doanh thu/.test(L)) return { s: p.plan_rev.toFixed(2) + '%' };
  if (/% hoàn thành KH LN sau thuế/.test(L)) return { s: p.plan_np.toFixed(2) + '%' };

  // Dividend
  if (/^Cổ tức \/ cp/.test(L)) return { s: p.div_ps.toLocaleString('vi-VN') };
  if (/^Tỷ lệ chi trả cổ tức/.test(L)) return { s: p.div_payout.toFixed(2) + '%' };
  if (/^Hệ số thanh toán cổ tức/.test(L)) return { s: p.div_cov.toFixed(2) };

  // Institutional Flow
  if (/Mua ròng K\.Ngoại 10 phiên/.test(L)) return { s: p.fr_net10 };
  if (/Mua ròng Tự doanh 10 phiên/.test(L)) return { s: p.prop_net10 };
  if (/^Sở hữu nước ngoài/.test(L)) return { s: p.fr_ratio.toFixed(2) + '%' };
  if (/^Room ngoại còn lại/.test(L)) return { s: p.fr_room };
  if (/^Sở hữu tổ chức/.test(L)) return { s: p.inst_ratio.toFixed(2) + '%' };
  if (/^Sở hữu nội bộ/.test(L)) return { s: p.insider_ratio.toFixed(2) + '%' };

  // Performance
  if (/^1 tuần/.test(L)) return { s: sp(p.perf_1w, 2, '%') };
  if (/^1 tháng/.test(L)) return { s: sp(p.perf_1m, 2, '%') };
  if (/^3 tháng/.test(L)) return { s: sp(p.perf_3m, 2, '%') };
  if (/^6 tháng/.test(L)) return { s: sp(p.perf_6m, 2, '%') };
  if (/Từ đầu năm/.test(L)) return { s: sp(p.perf_ytd, 2, '%') };
  if (/^1 năm/.test(L)) return { s: sp(p.perf_1y, 2, '%') };
  if (/^5 năm/.test(L)) return { s: sp(p.perf_5y, 2, '%') };
  if (/Dao động 1 tháng/.test(L)) return { s: p.volatility_1m.toFixed(2) + '%' };
  if (/Mức sụt giảm tối đa/.test(L)) return { s: sp(p.mdd, 2, '%') };

  return { s: '—' };
}

function fmtCmp(o, row) {
  if (o.tag) {
    const k = /Tăng|▲/.test(o.tag) ? 'g' : /Giảm|▼/.test(o.tag) ? 'r' : 'o';
    return { h: `<span class="tg ${k}">${esc(o.tag)}</span>`, c: 'sans' };
  }
  const s = o.s;
  if (!s || s === '—') return { h: '—', c: 'dash' };
  if (/^⌃/.test(s)) return { h: s, c: 'sans up', st: 'font-weight:500' };
  if (isNaN(parseNum(s))) return { h: s, c: 'sans' };
  const chg = /^Thay đổi trong ngày/.test(row.l);
  let col = '';
  if (chg || (/^[+−]/.test(s) && /%$/.test(s))) {
    col = /^\+/.test(s) ? 'up' : /^−/.test(s) ? 'down' : chg ? 'warn' : '';
  }
  return { h: s, c: col };
}

function renderCmpAllSections(T) {
  let body = '';
  CMP_SECTIONS.forEach(([title, q, rows], si) => {
    const closed = S.cmpClosed.has(si);
    body += `<section class="csec ${closed ? 'closed' : ''}">
      <div class="csec-h" data-act="cmpsec" data-v="${si}">
        <span class="ix">${String(si + 1).padStart(2, '0')}</span>
        <b>${title}</b>
        <span class="car">${I.chev}</span>
      </div>
      <div class="q">${q}</div>
      <div class="tscroll">
        <table class="t cmp">
          <thead>
            <tr><th>Chỉ số</th>${T.map(t => `<th>${t}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${rows.map((row, ri) => {
              const cells = T.map(t => cmpCell(t, row, si * 20 + ri));
              const f = cells.map(c => fmtCmp(c, row));
              let hiI = -1, loI = -1;
              if (row.hl && T.length > 2) {
                const arr = cells.map(c => parseNum(c.s));
                if (arr.every(x => !isNaN(x))) {
                  hiI = arr.indexOf(Math.max(...arr));
                  loI = arr.indexOf(Math.min(...arr));
                }
              }
              const lab = `<span class="lbl"><span ${srcTip(row)}>${row.l}</span>${srcTag(row)}</span>`;
              return `<tr>
                <td>${lab}</td>
                ${f.map((x, i) => `<td class="${x.c}" ${x.st ? `style="${x.st}"` : ''}><span class="cell">${i === hiI ? '<span class="tg">Cao</span>' : i === loI ? '<span class="tg">Thấp</span>' : ''}${x.h}</span></td>`).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </section>`;
  });
  return body;
}
