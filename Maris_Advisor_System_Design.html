function renderCmpPerfView(T) {
  const period = S.cmpPeriod || '3M';
  const colors = ['#38bdf8', '#f97316', '#22c55e', '#a855f7', '#eab308'];
  
  const ptsCount = 30;
  const periodKey = period === '1W' ? 'perf_1w' : period === '1M' ? 'perf_1m' : period === '3M' ? 'perf_3m' : period === '6M' ? 'perf_6m' : period === '1Y' ? 'perf_1y' : 'perf_ytd';
  
  const stockLines = T.map((t, idx) => {
    const p = getCmpData(t);
    const finalVal = p[periodKey] || 10.0;
    const color = colors[idx % colors.length];
    
    const coords = [];
    for (let i = 0; i < ptsCount; i++) {
      const prog = i / (ptsCount - 1);
      const wave = Math.sin(prog * Math.PI * 3 + idx) * (Math.abs(finalVal) * 0.15);
      const val = (prog * finalVal) + wave * (prog > 0.1 && prog < 0.9 ? 1 : 0);
      coords.push({ x: (i / (ptsCount - 1)) * 740 + 40, val });
    }
    return { t, color, finalVal, coords, name: p.n };
  });

  let allVals = stockLines.flatMap(l => l.coords.map(c => c.val)).concat([0]);
  let minVal = Math.min(...allVals) - 2;
  let maxVal = Math.max(...allVals) + 2;
  let range = maxVal - minVal || 1;
  const svgH = 220;
  
  const getY = val => svgH - 20 - ((val - minVal) / range) * (svgH - 40);
  const zeroY = getY(0);

  const polylines = stockLines.map(l => {
    const pointsStr = l.coords.map(c => `${c.x.toFixed(1)},${getY(c.val).toFixed(1)}`).join(' ');
    return `<polyline fill="none" stroke="${l.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${pointsStr}"/>`;
  }).join('');

  const legend = stockLines.map(l => {
    return `<div style="display:flex;align-items:center;gap:6px">
      <span style="width:10px;height:10px;border-radius:2px;background:${l.color}"></span>
      <b>${l.t}</b>
      <span style="font-family:var(--mono);color:${l.finalVal >= 0 ? '#4ade80' : '#f87171'}">${l.finalVal >= 0 ? '+' : ''}${l.finalVal.toFixed(1)}%</span>
    </div>`;
  }).join('');

  return `<div class="cmp-perf-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
      <div style="font-size:14px;font-weight:600">Biểu đồ Tương quan Hiệu suất Giá (% Chuẩn hóa)</div>
      <div class="cmp-perf-periods">
        ${['1W', '1M', '3M', '6M', '1Y', 'YTD'].map(per => `<button class="cmp-period-btn ${period === per ? 'active' : ''}" data-act="cmpperiod" data-v="${per}">${per}</button>`).join('')}
      </div>
    </div>
    
    <div style="width:100%;overflow-x:auto">
      <svg viewBox="0 0 800 ${svgH}" style="width:100%;min-width:600px;height:240px;background:var(--card-sub);border-radius:6px;border:1px solid var(--line)">

function getLiveTradingSessionInfo() {
  const now = new Date();
  const d = now.getDay();
  const h = now.getHours();
  const m = now.getMinutes();
  const timeNum = h * 60 + m;
  const dateStr = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getFullYear()}`;
  const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

  let statusText = '';
  let isOpen = false;

  if (d === 0 || d === 6) {
    statusText = `Đóng cửa cuối tuần · ${dateStr}`;
  } else {
    if (timeNum < 9 * 60) {
      statusText = `Trước giờ mở cửa · ${dateStr}`;
    } else if (timeNum <= 9 * 60 + 15) {
      statusText = `Phiên ATO (Mở cửa) · ${timeStr}`;
      isOpen = true;
    } else if (timeNum <= 11 * 60 + 30) {
      statusText = `Khớp lệnh liên tục (Sáng) · ${timeStr}`;
      isOpen = true;
    } else if (timeNum < 13 * 60) {
      statusText = `Nghỉ giữa phiên trưa · ${dateStr}`;
    } else if (timeNum <= 14 * 60 + 30) {
      statusText = `Khớp lệnh liên tục (Chiều) · ${timeStr}`;
      isOpen = true;
    } else if (timeNum <= 14 * 60 + 45) {
      statusText = `Phiên ATC (Đóng cửa) · ${timeStr}`;
      isOpen = true;
    } else {
      statusText = `Đóng cửa phiên · ${dateStr} ${timeStr}`;
    }
  }

  return { dateStr, timeStr, statusText, isOpen };
}

function syncMarketDataTick(isManual) {
  const session = getLiveTradingSessionInfo();
  MARKET_INDICES.forEach(idx => {
    const delta = +((Math.random() * 1.2 - 0.6).toFixed(2));
    idx.score = +(idx.score + delta).toFixed(2);
    idx.chg = +(idx.chg + delta).toFixed(2);
    idx.pct = +((idx.chg / (idx.score - idx.chg)) * 100).toFixed(2);
    idx.spark.push(idx.score);
    if (idx.spark.length > 12) idx.spark.shift();
    const currVal = parseFloat(idx.val.replace(/[^\d.]/g, '')) || 30000;
    idx.val = (currVal + Math.floor(Math.random() * 50 + 10)).toLocaleString('vi-VN') + ' tỷ';
    if (delta > 0) { idx.adv += Math.floor(Math.random() * 2 + 1); idx.dec = Math.max(0, idx.dec - 1); }
    else if (delta < 0) { idx.dec += Math.floor(Math.random() * 2 + 1); idx.adv = Math.max(0, idx.adv - 1); }
  });

  MARKET_SECTORS.forEach(sec => {
    const sDelta = +((Math.random() * 0.16 - 0.08).toFixed(2));
    sec.pct = +(sec.pct + sDelta).toFixed(2);
  });

  if (isManual && typeof toast === 'function') {
    toast(`↻ Đã cập nhật dữ liệu thị trường lúc ${session.timeStr}`);
  }
}

function renderSparklineSVG(pts, isUp) {
  const min = Math.min(...pts), max = Math.max(...pts), range = max - min || 1;
  const w = 90, h = 26;
  const coords = pts.map((val, idx) => {
    const x = (idx / (pts.length - 1)) * w;
    const y = h - 3 - ((val - min) / range) * (h - 6);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = isUp ? '#22c55e' : '#ef4444';
  return `<svg width="${w}" height="${h}" style="overflow:visible"><polyline fill="none" stroke="${color}" stroke-width="2" points="${coords}"/></svg>`;
}

/* ================= MARKET NEWS (TIN TỨC THỊ TRƯỜNG) ================= */
function vMarketNews() {
  const M = S.mnews || { tab: 0, q: '', span: 'Tất cả', sentiment: 'Tất cả', page: 1 };
  const filterTab = MNEWS_TABS[M.tab] ? MNEWS_TABS[M.tab][1] : () => true;
  const q = (M.q || '').trim().toLowerCase();
  
  // Filter by tab, search keyword, span, sentiment
  let filtered = MARKET_NEWS.filter(filterTab).filter(n => {
    if (!q) return true;
    const matchTitle = n.title.toLowerCase().includes(q);
    const matchSum = (n.summary || '').toLowerCase().includes(q);
    const matchTkrs = (n.tickers || []).some(t => t.s.toLowerCase().includes(q));
    const matchTags = (n.tags || []).some(t => t.toLowerCase().includes(q));
    return matchTitle || matchSum || matchTkrs || matchTags;
  }).filter(n => {
    if (M.span === 'Hôm nay') return n.time.includes('Hôm nay');
    if (M.span === '3 ngày') return n.time.includes('Hôm nay') || n.time.includes('Hôm qua') || n.time.includes('08/10') || n.time.includes('07/10');
    if (M.span === '7 ngày') return true;
    return true;
  }).filter(n => {
    if (M.sentiment === 'Tích cực') return n.sentiment === 'TÍCH CỰC';
    if (M.sentiment === 'Trung lập') return n.sentiment === 'TRUNG LẬP';
    if (M.sentiment === 'Tiêu cực') return n.sentiment === 'TIÊU CỰC';
    return true;
  });

  const total = filtered.length;
  const pageSize = 10;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  const curPage = Math.min(M.page || 1, pages);
  const startIdx = (curPage - 1) * pageSize;
  const pageRows = filtered.slice(startIdx, startIdx + pageSize);

  // Hero Story logic: show if first page, tab is 0 (or Breaking), and no specific query
  const heroStory = (!q && curPage === 1 && (M.tab === 0 || M.tab === 1)) ? MARKET_NEWS.find(n => n.isHero) : null;
  // If hero is displayed separately, avoid duplicating in list if present
  const displayRows = heroStory ? pageRows.filter(n => n.id !== heroStory.id) : pageRows;

  // Sentiment class
  const sentCls = s => s === 'TÍCH CỰC' ? 'bullish' : (s === 'TIÊU CỰC' ? 'bearish' : 'neutral');

  const pgBtn = p => `<button class="${curPage === p ? 'on' : ''}" data-act="mnewspage" data-v="${p}">${p}</button>`;

/* FETCH & APPLY DUAL MCP DATA PIPELINE (DNSE + VNDIRECT) */
function fetchAndApplyDnseMcpData(sym, isManualDnse, isManualVnd) {
  if (!sym) return;
  sym = sym.replace(/\s*\(DNSE\)/i, '').replace(/\s*\(VND\)/i, '').toUpperCase().trim();

  // 1. Get DNSE data
  const data = (typeof DNSE_STOCKS_DB !== 'undefined' && DNSE_STOCKS_DB[sym]) ? DNSE_STOCKS_DB[sym] : synthesizeDnseMcpData(sym);

  // 2. Get VND data
  const vndData = (typeof VND_STOCKS_DB !== 'undefined' && VND_STOCKS_DB[sym]) ? VND_STOCKS_DB[sym] : synthesizeVndMcpData(sym, data.price, data.ind);

  // 3. Mutate & reassign STOCK
  let currentPrice = data.price;
  let currentChg = data.chg;
  let currentPct = data.pct;
  if (isManualDnse || isManualVnd) {
    const tickShift = (Math.floor(Math.random() * 3) - 1) * 50;
    currentPrice += tickShift;
    currentChg += tickShift;
    currentPct = +((currentChg / (currentPrice - currentChg || 1)) * 100).toFixed(2);
  }
  Object.assign(STOCK, {
    sym: data.sym,
    ex: data.ex,
    name: data.name,
    ind: data.ind,
    price: currentPrice,
    chg: currentChg,
    pct: currentPct,
    mcpSource: 'Dual-MCP (DNSE + VNDIRECT)',
    metrics: data.metrics,
    events: data.events || []
  });

  // 4. Update fundamental factors & subviews
  if (data.factors) FACTORS = data.factors;
  if (data.highlights) HIGHLIGHTS = data.highlights;
  if (data.changes) CHANGES = data.changes;
  if (data.radar) RADAR = { axes: data.radar.axes, msb: data.radar.current, ind: data.radar.ind };
  if (data.position) POSITION = data.position;
  if (data.perf) PERF = data.perf;
  if (data.profile) PROFILE = data.profile;
  if (data.peers) {
    PEERS = data.peers;
    if (!PEERS[S.peerSub]) S.peerSub = Object.keys(PEERS)[0] || 'Tổng quan';
  }

  // Update VS_IND dynamically based on stock & sector
  if (sym === 'FPT') {
    VS_IND = [
      ['P/E (TTM)', '24,80', '22,10'],
      ['P/B (MRQ)', '5,62', '3,80'],
      ['EPS (TTM)', '5.580', '3.420'],
      ['ROE', '28,4%', '18,5%'],
      ['ROA', '14,2%', '9,8%'],
      ['Biên LN ròng', '17,6%', '12,4%'],
      ['Tỷ suất cổ tức', '2,2%', '1,8%']
    ];
  } else if (sym === 'HPG') {
    VS_IND = [
      ['P/E (TTM)', '12,40', '14,80'],
      ['P/B (MRQ)', '1,48', '1,65'],
      ['EPS (TTM)', '2.130', '1.650'],
      ['ROE', '12,6%', '9,4%'],
      ['ROA', '6,8%', '4,9%'],
      ['Biên LN gộp', '14,8%', '11,2%'],
      ['Tỷ suất cổ tức', '2,8%', '2,1%']
    ];
  } else if (sym === 'VNM') {
    VS_IND = [
      ['P/E (TTM)', '14,20', '18,50'],
      ['P/B (MRQ)', '3,90', '2,80'],
      ['EPS (TTM)', '4.150', '2.840'],
      ['ROE', '27,5%', '15,2%'],
      ['ROA', '16,8%', '8,5%'],
      ['Biên LN gộp', '42,5%', '31,0%'],
      ['Tỷ suất cổ tức', '5,8%', '3,2%']
    ];
  } else {
    const curVal = (typeof getStockValuationData === 'function') ? getStockValuationData() : null;
    VS_IND = [
      ['P/E (TTM)', curVal ? fmtVN(curVal.peVal, 2) : '7,41', curVal ? fmtVN(curVal.indPe, 2) : '11,25'],
      ['P/B (MRQ)', curVal ? fmtVN(curVal.pbVal, 2) : '1,08', curVal ? fmtVN(curVal.indPb, 2) : '1,62'],
      ['EPS (TTM)', (STOCK.metrics?.val?.find(x => x[0].includes('EPS'))?.[1] || '1.923').replace(' đ', ''), '2.640'],
      ['ROE', (curVal ? curVal.roeVal : '14,8%'), '19,6%'],
      ['ROA', '2,04%', '1,88%'],
      ['NIM', '3,92%', '3,64%'],
      ['Tỷ suất cổ tức', '5,3%', '2,9%']
    ];
  }

  // 5. Invalidate intraday cache & re-generate price candles
  INTRA = null;
  const symSeed = sym.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
  CANDLES = makeCandles(STOCK.price, symSeed);

  // 6. Update ALL MCP Payloads (DNSE, VNDIRECT & SSI)
  updateDnseMcpPayloadsForSymbol(data);
  updateVndMcpPayloadsForSymbol(sym, vndData);
  updateSsiMcpPayloadsForSymbol(sym);
  updateLogoMcpPayloadsForSymbol(sym);

  // 7. Feedback toast
  if (typeof toast === 'function') {
    if (isManualDnse && isManualVnd) {
      toast(`↻ Đã cập nhật dữ liệu mới nhất cho ${sym}`);
    } else if (isManualVnd) {
      toast(`↻ Đã cập nhật phân tích cho ${sym}`);
    } else if (isManualDnse) {
      toast(`↻ Đã cập nhật dữ liệu giá cho ${sym}`);
    } else {
      
    }
  }

  // 8. Update Modal if currently open
  const modalEl = document.getElementById('modal-dnse-mcp');
  if (modalEl && modalEl.classList.contains('open')) {
    renderMcpToolTabs();
    renderDnseMcpModal();
  }

  // 9. Re-render UI
  if (typeof rerender === 'function') {
    rerender();
  }
}

/* ================= BINANCE LIVE STREAMING ENGINE ================= */
let binanceWs = null;
let binanceWsStarted = false;

async function fetchBinanceLiveData() {
  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT"]');
    if (!res.ok) return;
    const data = await res.json();
    data.forEach(item => {
      const sym = item.symbol;
      const price = parseFloat(item.lastPrice);
      const chg = parseFloat(item.priceChange);
      const pct = parseFloat(item.priceChangePercent);
      const isUp = pct >= 0;

      const target = GLOBAL_INDICES.find(g => g.sym === sym || g.name.includes(sym.replace('USDT', '')));
      if (target) {
        target.val = (price >= 100 ? price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : price.toFixed(2)) + ' $';
        target.chg = (chg >= 0 ? '+' : '') + (Math.abs(chg) >= 100 ? chg.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : chg.toFixed(2));
        target.pct = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
        target.up = isUp;
        target.live = true;
      }
    });

    if (S.route === 'market' && (S.mktTab === 'global')) {
      updateBinanceCardsInDOM();
    }
  } catch (err) {
    console.warn('Binance REST fetch:', err);
  }
}

function updateBinanceCardsInDOM() {
  GLOBAL_INDICES.filter(g => g.region === 'Binance').forEach(g => {
    const sym = g.sym || (g.name.includes('BTC') ? 'BTCUSDT' : g.name.includes('ETH') ? 'ETHUSDT' : g.name.includes('BNB') ? 'BNBUSDT' : 'SOLUSDT');
    const cardEl = document.querySelector(`[data-global-sym="${sym}"]`);
    if (cardEl) {
      const valEl = cardEl.querySelector('.mkt-global-val');
      const chgEl = cardEl.querySelector('.mkt-global-chg');
      if (valEl) valEl.textContent = g.val;
      if (chgEl) {
        chgEl.textContent = `${g.chg} (${g.pct})`;
        chgEl.style.color = g.up ? 'var(--up)' : 'var(--down)';
      }
    }
  });
}

function initBinanceWebSocket() {
  if (binanceWsStarted) return;
  binanceWsStarted = true;
  try {
    binanceWs = new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@ticker/ethusdt@ticker/bnbusdt@ticker/solusdt@ticker');
    binanceWs.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        const d = msg.data;
        if (!d || !d.s) return;
        const sym = d.s;
        const price = parseFloat(d.c);
        const chg = parseFloat(d.p);
        const pct = parseFloat(d.P);
        const isUp = pct >= 0;

        const target = GLOBAL_INDICES.find(g => g.sym === sym || g.name.includes(sym.replace('USDT', '')));
        if (target) {
          const oldNum = parseFloat(target.val.replace(/[^0-9.-]/g, '')) || 0;
          target.val = (price >= 100 ? price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : price.toFixed(2)) + ' $';
          target.chg = (chg >= 0 ? '+' : '') + (Math.abs(chg) >= 100 ? chg.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : chg.toFixed(2));
          target.pct = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
          target.up = isUp;

          const cardEl = document.querySelector(`[data-global-sym="${sym}"]`);
          if (cardEl) {
            const valEl = cardEl.querySelector('.mkt-global-val');
            const chgEl = cardEl.querySelector('.mkt-global-chg');
            if (valEl) {
              valEl.textContent = target.val;
              valEl.classList.remove('flash-up', 'flash-down');
              void valEl.offsetWidth;
              valEl.classList.add(price >= oldNum ? 'flash-up' : 'flash-down');
            }
            if (chgEl) {
              chgEl.textContent = `${target.chg} (${target.pct})`;
              chgEl.style.color = isUp ? 'var(--up)' : 'var(--down)';
            }
          }
        }
      } catch (_) {}
    };
    binanceWs.onclose = () => {
      binanceWsStarted = false;
      setTimeout(initBinanceWebSocket, 5000);
    };
    binanceWs.onerror = () => {};
  } catch (_) {}
}

// Auto-trigger Binance fetch and WS on init
setTimeout(() => {
  fetchBinanceLiveData();
  initBinanceWebSocket();
}, 600);

startRealtimeEngine();

</script>
