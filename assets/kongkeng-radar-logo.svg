<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" fill="none">
  <defs>
    <linearGradient id="kkr-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="kkr-sweep-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="kkr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Radar Icon -->
  <g transform="translate(15, 8)">
    <!-- Outer concentric ring -->
    <circle cx="32" cy="32" r="30" stroke="url(#kkr-gradient)" stroke-width="2.5" opacity="0.35" stroke-dasharray="4 3"/>
    <!-- Middle ring -->
    <circle cx="32" cy="32" r="21" stroke="url(#kkr-gradient)" stroke-width="2" opacity="0.7"/>
    <!-- Inner ring -->
    <circle cx="32" cy="32" r="11" stroke="url(#kkr-gradient)" stroke-width="1.8" opacity="0.95"/>
    <!-- Center Target Blip with Glow -->
    <circle cx="32" cy="32" r="4.5" fill="url(#kkr-gradient)" filter="url(#kkr-glow)"/>
    <!-- Radar Sweep Sector -->
    <path d="M32 32 L60 16 A30 30 0 0 0 32 2 Z" fill="url(#kkr-sweep-grad)"/>
    <!-- Radar Blip Point 1 -->
    <circle cx="48" cy="20" r="2.5" fill="#30D158" filter="url(#kkr-glow)"/>
    <!-- Radar Blip Point 2 -->
    <circle cx="22" cy="42" r="2.2" fill="#FFD60A" opacity="0.85"/>
    <!-- Crosshairs -->
    <line x1="32" y1="2" x2="32" y2="62" stroke="url(#kkr-gradient)" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
    <line x1="2" y1="32" x2="62" y2="32" stroke="url(#kkr-gradient)" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
  </g>

  <!-- Typography -->
  <g transform="translate(92, 48)">
    <text font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8" fill="#FFFFFF">KongKeng</text>
  </g>

  <!-- Tech Badge "RADAR" -->
  <g transform="translate(262, 24)">
    <rect width="92" height="26" rx="5" fill="url(#kkr-gradient)"/>
    <text x="46" y="17.5" text-anchor="middle" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="2.8">RADAR</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(94, 66)">
    <text font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#8B949E" letter-spacing="0.5">NEXT-GEN FINANCIAL SIGNAL TERMINAL</text>
  </g>
</svg>